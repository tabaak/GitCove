name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v3 # the image's arm64 stage runs apk
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: true
          build-args: VERSION=${{ github.ref_name }}
          tags: | # image names must be lowercase, and the repo is tabaak/GitCove
            ghcr.io/tabaak/gitcove:${{ github.ref_name }}
            ghcr.io/tabaak/gitcove:latest
      - uses: anchore/sbom-action/download-syft@v0 # GoReleaser's sboms step runs syft
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }} # GITHUB_TOKEN can't push to tabaak/homebrew-tap
      - name: source of the image's GPL packages
        run: |
          release/gpl-sources.sh "ghcr.io/tabaak/gitcove:${{ github.ref_name }}" "$RUNNER_TEMP/gitcove-gpl-sources.tar.gz"
          gh release upload "${{ github.ref_name }}" "$RUNNER_TEMP/gitcove-gpl-sources.tar.gz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
